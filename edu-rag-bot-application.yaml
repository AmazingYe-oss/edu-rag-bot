apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: edu-rag-bot
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/AmazingYe-oss/edu-rag-bot-gitops.git
    targetRevision: main
    path: apps/edu-rag-bot

  destination:
    server: https://kubernetes.default.svc
    namespace: edu-rag-bot

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
