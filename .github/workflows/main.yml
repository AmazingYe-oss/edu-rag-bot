name: Build-and-Push-to-ACR

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ACR_REGISTRY: crpi-he7mqvhihpnvi08o.cn-shanghai.personal.cr.aliyuncs.com
  IMAGE_REPOSITORY: my-rag-project/rag-service
  GITOPS_REPO: AmazingYe-oss/edu-rag-bot-gitops
  GITOPS_FILE: apps/edu-rag-bot/deployment.yaml

jobs:
  build-and-update-gitops:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application code
        uses: actions/checkout@v4

      # 【核心逃生舱 1】不依赖任何下载插件，直接用原生命令登录阿里云！
      - name: Login to ACR (Raw Shell)
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ env.ACR_REGISTRY }} -u "${{ secrets.ACR_USERNAME }}" --password-stdin

      # 【核心逃生舱 2】直接用原生命令打包镜像！没有任何中间商赚差价！
      - name: Build Docker image locally (Raw Shell)
        run: |
          docker build \
            -t ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:latest \
            -t ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }} \
            -f ./Dockerfile .

      - name: Push Docker image to ACR (Raw Shell)
        run: |
          echo "✅ 原生命令打包成功！开始推送到阿里云 ACR..."
          docker push ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:latest
          docker push ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          ref: main

      - name: Update image tag in GitOps repo
        run: |
          cd gitops
          NEW_IMAGE="${{ env.ACR_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}"
          echo "New image: ${NEW_IMAGE}"
          sed -i "s|^\([[:space:]]*image: \).*|\1${NEW_IMAGE}|" "${{ env.GITOPS_FILE }}"
          echo "Updated deployment.yaml:"
          grep "image:" "${{ env.GITOPS_FILE }}"

      - name: Commit and push GitOps changes
        run: |
          cd gitops
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git status
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git add "${{ env.GITOPS_FILE }}"
          git commit -m "chore: update edu-rag-bot image to ${{ github.sha }} [Raw Shell]"
          git push
