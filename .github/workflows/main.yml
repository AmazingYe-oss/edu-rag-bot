name: Build-and-Push-to-ACR

on:
  push:
    branches:
      - main
  workflow_dispatch:   

env:
  ACR_REGISTRY: crpi-he7mqvhihpnvi08o.cn-shanghai.personal.cr.aliyuncs.com
  IMAGE_REPOSITORY: my-rag-project/rag-service
  GITOPS_REPO: AmazingYe-oss/edu-rag-bot-gitops
  GITOPS_FILE: apps/edu-rag-bot/deployment.yaml

jobs:
  build-and-update-gitops:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application code
        uses: actions/checkout@v4

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker image locally
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:latest
            ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.ACR_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker image to ACR
        run: |
          echo "✅ 安全扫描完成！开始推送到阿里云 ACR..."
          docker push ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:latest
          docker push ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          ref: main

      - name: Update image tag in GitOps repo
        run: |
          cd gitops
          NEW_IMAGE="${{ env.ACR_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}"
          echo "New image: ${NEW_IMAGE}"
          sed -i "s|^\([[:space:]]*image: \).*|\1${NEW_IMAGE}|" "${{ env.GITOPS_FILE }}"
          echo "Updated deployment.yaml:"
          grep "image:" "${{ env.GITOPS_FILE }}"

      - name: Commit and push GitOps changes
        run: |
          cd gitops
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git status
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git add "${{ env.GITOPS_FILE }}"
          git commit -m "chore: update edu-rag-bot image to ${{ github.sha }} [Security Scanned]"
          git push
