version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-api
    command: python api.py
    ports:
      - "8000:8000"
    # 🔥 师傅秘籍：用 env_file 替代手动写环境变量
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - rag-net

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-ui
    command: python ui.py
    ports:
      - "7860:7860"
    environment:
      - API_URL=http://api:8000/api/chat
      - UPLOAD_URL=http://api:8000/api/upload
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - rag-net

networks:
  rag-net:
    driver: bridge

